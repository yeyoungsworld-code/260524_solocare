function calculateRisk({ electricity_drop_rate, living_alone, is_elderly, irregular_meal, no_outing, no_contact, need_help }) {
  let score = 0; const reasons = [];
  if (electricity_drop_rate >= 60)      { score += 30; reasons.push("전력사용량 60% 이상 감소"); }
  else if (electricity_drop_rate >= 40) { score += 20; reasons.push("전력사용량 40% 이상 감소"); }
  else if (electricity_drop_rate >= 20) { score += 10; reasons.push("전력사용량 20% 이상 감소"); }
  if (living_alone)    { score += 20; reasons.push("1인 가구"); }
  if (is_elderly)      { score += 15; reasons.push("고령층"); }
  if (irregular_meal)  { score += 15; reasons.push("최근 식사 불규칙"); }
  if (no_outing)       { score += 20; reasons.push("최근 외출 없음"); }
  if (no_contact)      { score += 20; reasons.push("최근 연락 없음"); }
  if (need_help)       { score += 20; reasons.push("도움 필요 응답"); }
  const level = score >= 70 ? "위험" : score >= 40 ? "주의" : "관심";
  return { score, level, reasons };
}

function convertSurveyInput(s) {
  return {
    user_id: s.user_id,
    irregular_meal: s.regular_meal === false,
    no_outing:      s.has_outing === false,
    no_contact:     s.has_contact === false,
    need_help:      s.need_help === true,
  };
}

function generateAiSummary(user, recs) {
  const r = Array.isArray(user.reasons) ? user.reasons.filter(x => x !== "해당 사항 없음") : [];
  const recText = (recs || []).slice(0, 2).join(', ');
  if (user.level === "위험") {
    return `${user.user_id} 대상자(${user.region}, ${user.age}세)는 ${r.slice(0,3).join(', ')} 등의 사유로 안부확인 필요도가 '위험' 등급(${user.score}점)으로 분류되었습니다. 전력사용량이 평균 대비 ${user.electricity_drop_rate}% 감소한 상태이므로 우선적으로 전화 확인이 필요하며, 미응답 시 방문 확인이 권장됩니다.`;
  }
  if (user.level === "주의") {
    return `${user.user_id} 대상자(${user.region}, ${user.age}세)는 ${r.join(', ')} 사유로 '주의' 등급(${user.score}점)으로 분류되었습니다. 정기적인 전화 안부확인과 함께 복지 서비스 연계를 검토하시기 바랍니다.`;
  }
  return `${user.user_id} 대상자(${user.region}, ${user.age}세)는 현재 '관심' 등급(${user.score}점)으로 분류되어 있습니다. 정기적인 안부확인 서비스를 안내하고 지역 복지관 프로그램 연계를 고려해 주세요.`;
}

function generateContactMessage(user) {
  return `안녕하세요, 충남 ${user.region} 행정복지센터입니다.\n\n안녕히 계시는지 안부 확인을 위해 연락드렸습니다.\n최근 식사와 건강 상태는 괜찮으신지 여쭤보고 싶습니다.\n\n혹시 필요하신 도움이 있거나 불편하신 점이 있으시면 언제든지 말씀해 주세요.\n저희가 함께 도와드리겠습니다.\n\n📞 행정복지센터 대표번호로 연락 주시면 됩니다.\n감사합니다.`;
}

function generateDangerReport(dangerUsers) {
  const regions = [...new Set(dangerUsers.map(u => u.region))].join(', ');
  const avgScore = dangerUsers.length ? Math.round(dangerUsers.reduce((a,b) => a + b.score, 0) / dangerUsers.length) : 0;
  const highDrop = dangerUsers.filter(u => u.electricity_drop_rate >= 60).length;
  return `오늘 우선 확인이 필요한 위험 등급 대상자는 총 ${dangerUsers.length}명입니다.\n주요 해당 지역: ${regions}.\n\n이 중 전력사용량 60% 이상 감소 대상자가 ${highDrop}명으로, 평균 안부확인 필요도 점수는 ${avgScore}점입니다. 전력사용량 감소율이 높고 최근 외출 또는 연락이 없는 대상자가 다수 포함되어 있습니다.\n\n우선 위험 등급 대상자에게 전화 확인을 진행하고, 미응답자는 방문 확인 대상으로 분류하는 것이 권장됩니다.`;
}

          <div className="text-xs mt-0.5 opacity-80">{c.label}</div>

      ))}

  );
}

// UserTable
function UserTable({ users, onSelectUser }) {
  const [levelFilter, setLevelFilter] = useState("전체");
  const [regionFilter, setRegionFilter] = useState("전체");
  const [sort, setSort] = useState("위험등급 우선");
  const regions = ["전체", ...new Set(users.map(u => u.region))];
  const levels = ["전체","위험","주의","관심"];
  const sorts = ["위험등급 우선","점수 높은 순","전력 감소율 높은 순","나이 높은 순"];

  const filtered = useMemo(() => {
    let list = [...users];
    if (levelFilter !== "전체") list = list.filter(u => u.level === levelFilter);
    if (regionFilter !== "전체") list = list.filter(u => u.region === regionFilter);
    const order = { "위험":0,"주의":1,"관심":2 };
    if (sort === "위험등급 우선")       list.sort((a,b) => order[a.level] - order[b.level] || b.score - a.score);
    else if (sort === "점수 높은 순")    list.sort((a,b) => b.score - a.score);
    else if (sort === "전력 감소율 높은 순") list.sort((a,b) => b.electricity_drop_rate - a.electricity_drop_rate);
    else if (sort === "나이 높은 순")    list.sort((a,b) => b.age - a.age);
    return list;
  }, [users, levelFilter, regionFilter, sort]);

  return (
    <div>
      {/* 필터/정렬 */}
      <div className="flex flex-wrap gap-2 mb-4 items-center">
        <div className="flex gap-1">
          {levels.map(l => (
            <button key={l} onClick={() => setLevelFilter(l)}
              className={`px-3 py-1 rounded-full text-sm font-medium transition-colors ${levelFilter===l
                ? l==="위험" ? "bg-red-500 text-white" : l==="주의" ? "bg-yellow-400 text-white" : l==="관심" ? "bg-green-500 text-white" : "bg-indigo-600 text-white"
                : "bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>
              {l}
            </button>
          ))}
        </div>
        <select value={regionFilter} onChange={e=>setRegionFilter(e.target.value)}
          className="border border-gray-200 rounded-lg px-3 py-1 text-sm text-gray-700 bg-white">
          {regions.map(r => <option key={r}>{r}</option>)}
        </select>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          className="border border-gray-200 rounded-lg px-3 py-1 text-sm text-gray-700 bg-white">
          {sorts.map(s => <option key={s}>{s}</option>)}
        </select>
        <span className="text-sm text-gray-400 ml-auto">{filtered.length}명</span>
      </div>
      {/* 테이블 */}
      <div className="overflow-x-auto rounded-xl border border-gray-200">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
            <tr>
              {["대상자 ID","지역","나이","전력 감소율","점수","등급","상태"].map(h => (
                <th key={h} className="px-4 py-3 text-left font-semibold">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {filtered.map(u => (
              <tr key={u.user_id} onClick={() => onSelectUser(u)}
                className="hover:bg-indigo-50 cursor-pointer transition-colors">
                <td className="px-4 py-3 font-bold text-indigo-700">{u.user_id}</td>
                <td className="px-4 py-3 text-gray-700">{u.region}</td>
                <td className="px-4 py-3 text-gray-700">{u.age}세</td>
                <td className="px-4 py-3">
                  <span className={`font-semibold ${u.electricity_drop_rate>=60?"text-red-600":u.electricity_drop_rate>=40?"text-orange-500":"text-yellow-600"}`}>
                    {u.electricity_drop_rate}%
                  </span>
                </td>
                <td className="px-4 py-3 font-bold text-gray-800">{u.score}점</td>
                <td className="px-4 py-3"><RiskBadge level={u.level} /></td>
                <td className="px-4 py-3"><StatusBadge status={u.status} /></td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={7} className="px-4 py-8 text-center text-gray-400">해당하는 대상자가 없습니다.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// BarChartCanvas — Chart.js 기반 막대그래프
function BarChartCanvas({ labels, values, colors, unit }) {
  const ref = useRef(null);
  const chartInst = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartInst.current) chartInst.current.destroy();
    chartInst.current = new Chart(ref.current, {
      type: "bar",
      data: {
        labels,
        datasets: [{ data: values, backgroundColor: colors, borderRadius: 6 }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => ` ${ctx.parsed.y}${unit}` }
        }},
        scales: {
          x: { ticks: { font: { size: 11 }, maxRotation: 40 } },
          y: { beginAtZero: true, ticks: { callback: v => v + unit, font: { size: 11 } } },
        },
      },
    });
    return () => chartInst.current && chartInst.current.destroy();
  }, []);
  return <canvas ref={ref}></canvas>;
}

// SurveyForm
function SurveyForm({ onResult }) {
  const [form, setForm] = useState({ user_id:"", regular_meal:null, has_outing:null, has_contact:null, need_help:null });
  const [error, setError] = useState("");

  const set = (key, val) => setForm(f => ({...f, [key]: val}));

  const YesNo = ({ label, field }) => (
    <div className="bg-gray-50 rounded-xl p-4">
      <p className="text-sm font-semibold text-gray-700 mb-3">{label}</p>
      <div className="flex gap-3">
        {[true, false].map(v => (
          <button key={String(v)} onClick={() => set(field, v)}
            className={`flex-1 py-2.5 rounded-lg text-sm font-semibold border-2 transition-all ${form[field]===v
              ? (v ? "border-green-500 bg-green-50 text-green-700" : "border-red-400 bg-red-50 text-red-600")
              : "border-gray-200 bg-white text-gray-500 hover:border-gray-300"}`}>
            {v ? "예" : "아니오"}
          </button>
        ))}
      </div>
    </div>
  );

  const submit = () => {
    if (!form.user_id) { setError("대상자 ID를 선택해주세요."); return; }
    if ([form.regular_meal, form.has_outing, form.has_contact, form.need_help].some(v => v === null)) {
      setError("모든 질문에 답변해 주세요."); return;
    }
    setError("");
    const user = SAMPLE_USERS.find(u => u.user_id === form.user_id);
    if (!user) { setError("대상자를 찾을 수 없습니다."); return; }
    const converted = convertSurveyInput(form);
    const result = calculateRisk({
      electricity_drop_rate: user.electricity_drop_rate,
      living_alone: user.living_alone,
      is_elderly: user.is_elderly,
      ...converted,
    });
    const recs = RECOMMENDATIONS[result.level] || [];
    const summary = generateAiSummary({ ...user, ...result }, recs);
    onResult({ user, survey: converted, result, recs, summary });
  };

  return (
    <div className="max-w-lg mx-auto space-y-4">
      <div className="bg-gray-50 rounded-xl p-4">
        <p className="text-sm font-semibold text-gray-700 mb-2">1. 대상자 ID를 선택해주세요.</p>
        <select value={form.user_id} onChange={e => set("user_id", e.target.value)}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white text-gray-700">
          <option value="">-- 선택 --</option>
          {SAMPLE_USERS.map(u => <option key={u.user_id} value={u.user_id}>{u.user_id} ({u.region}, {u.age}세)</option>)}
        </select>
      </div>
      <YesNo label="2. 최근 3일 동안 식사를 규칙적으로 하셨나요?" field="regular_meal" />
      <YesNo label="3. 최근 7일 동안 외출한 적이 있나요?" field="has_outing" />
      <YesNo label="4. 최근 7일 동안 가족, 친구, 이웃과 연락한 적이 있나요?" field="has_contact" />
      <YesNo label="5. 현재 몸이 아프거나 도움이 필요한 상태인가요?" field="need_help" />
      {error && <p className="text-red-500 text-sm">{error}</p>}
      <button onClick={submit}
        className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-base hover:bg-indigo-700 transition-colors shadow-sm">
        문진 제출 →
      </button>
    </div>
  );
}

          안부확인이 필요한 대상자를 선별하는 보조 도구입니다.
        </p>
      </div>
    </div>
  );
}

function AdminDashboard({ navigate }) {
  const [selectedUser, setSelectedUser] = useState(null);
  const [showDangerReport, setShowDangerReport] = useState(false);
  const [activeTab, setActiveTab] = useState("users");
  const dangerUsers = SAMPLE_USERS.filter(u => u.level === "위험");

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Header */}
      <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <button onClick={() => navigate("home")} className="font-black text-xl text-gray-900">
            솔로<span className="text-indigo-600">케어</span> <span className="text-sm text-gray-400 font-normal">충남</span>
          </button>
          <div className="flex gap-2">
            <button onClick={() => setShowDangerReport(true)}
              className="px-3 py-1.5 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600 transition-colors">
              🔴 오늘의 위험 요약
            </button>
            <button onClick={() => navigate("survey")}
              className="px-3 py-1.5 border border-indigo-300 text-indigo-600 text-sm font-semibold rounded-lg hover:bg-indigo-50 transition-colors">
              문진 입력
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-6">
        <SummaryCards summary={DASHBOARD_SUMMARY} onDangerReport={() => setShowDangerReport(true)} />

        {/* Tabs */}
        <div className="flex gap-2 mb-4 border-b border-gray-200">
          {[["users","대상자 목록"],["region","지역 통계"]].map(([k,v]) => (
            <button key={k} onClick={() => setActiveTab(k)}
              className={`pb-2 px-3 text-sm font-semibold border-b-2 transition-colors ${activeTab===k
                ? "border-indigo-600 text-indigo-600" : "border-transparent text-gray-400 hover:text-gray-600"}`}>
              {v}
            </button>
          ))}
        </div>

        {activeTab === "users" && (
          <div className="bg-white rounded-2xl border border-gray-200 p-5">
            <UserTable users={SAMPLE_USERS} onSelectUser={setSelectedUser} />
          </div>
        )}
        {activeTab === "region" && (
          <div className="bg-white rounded-2xl border border-gray-200 p-5">
            <h2 className="font-bold text-gray-800 mb-5">충남 지역별 1인 가구 통계</h2>
            <RegionStats />
          </div>
        )}
      </main>

      {selectedUser && <UserDetailModal user={selectedUser} onClose={() => setSelectedUser(null)} />}
      {showDangerReport && <DangerReportModal users={dangerUsers} onClose={() => setShowDangerReport(false)} />}
    </div>
  );
}

function SurveyDone({ user, onBack }) {
  return (
    <div className="max-w-sm mx-auto text-center fade-in pt-8">
      <div className="text-6xl mb-4">✅</div>
      <h2 className="text-2xl font-black text-gray-800 mb-2">접수되었습니다</h2>
      <p className="text-gray-500 text-sm leading-relaxed mb-6">
        <span className="font-semibold text-gray-700">{user.user_id}</span> 대상자의 생활 문진이<br/>
        정상적으로 접수되었습니다.<br/>
        담당자가 확인 후 안내드리겠습니다.
      </p>
      <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-sm text-indigo-700 mb-6">
        📋 접수 일시: {new Date().toLocaleString("ko-KR")}
      </div>
      <button onClick={onBack}
        className="w-full py-3 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50 transition-colors">
        ← 다시 문진하기
      </button>
    </div>
  );
}

function SurveyPage({ navigate }) {
  const [result, setResult] = useState(null);

  return (
    <div className="min-h-screen bg-gray-50">
      <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
          <button onClick={() => navigate("home")} className="text-gray-400 hover:text-gray-700">←</button>
          <h1 className="font-bold text-gray-800">{result ? "문진 접수 완료" : "생활 문진"}</h1>
          <button onClick={() => navigate("admin")} className="ml-auto text-xs text-indigo-600 hover:underline">관리자 대시보드</button>
        </div>
      </header>
      <main className="max-w-7xl mx-auto px-4 py-8">
        {result
          ? <SurveyDone user={result.user} onBack={() => setResult(null)} />
          : (
            <div>
              <p className="text-center text-sm text-gray-500 mb-6">
                아래 질문에 답변해 주세요. 전력 데이터는 시스템에서 자동으로 불러옵니다.
              </p>
              <SurveyForm onResult={setResult} />
            </div>
          )
        }
      </main>
    </div>
  );
}

// ──────────────────────────────────────────────
// APP (Simple hash router)
// ──────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const navigate = (p) => setPage(p);

  if (page === "admin")  return <AdminDashboard navigate={navigate} />;
  if (page === "survey") return <SurveyPage navigate={navigate} />;
  return <HomePage navigate={navigate} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
